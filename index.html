<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nested — learn a language through its own words</title>
<style>
  :root {
    --bg: #fbfbfd;
    --wash: rgba(0,113,227,.10);
    --surface: #ffffff;
    --surface-2: #f2f2f5;
    --glass: rgba(251,251,253,.72);
    --ink: #1d1d1f;
    --ink-2: #6e6e73;
    --ink-3: #a6a6ab;
    --accent: #0071e3;
    --accent-bg: #e8f1fd;
    --star: #f0a020;
    --hair: rgba(0,0,0,.08);
    --shadow: 0 1px 1px rgba(0,0,0,.03), 0 10px 30px rgba(0,0,0,.06), 0 30px 60px rgba(0,0,0,.05);
    --pop: 0 6px 20px rgba(0,0,0,.10), 0 20px 50px rgba(0,0,0,.12);
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
    --serif: "New York", ui-serif, "Iowan Old Style", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --wash: rgba(10,132,255,.16);
      --surface: #161618;
      --surface-2: #202024;
      --glass: rgba(0,0,0,.66);
      --ink: #f5f5f7;
      --ink-2: #a1a1a6;
      --ink-3: #6c6c70;
      --accent: #0a84ff;
      --accent-bg: #0e2947;
      --star: #ffd426;
      --hair: rgba(255,255,255,.10);
      --shadow: 0 1px 1px rgba(0,0,0,.5), 0 12px 34px rgba(0,0,0,.55);
      --pop: 0 10px 30px rgba(0,0,0,.6), 0 24px 60px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--ui);
    -webkit-font-smoothing: antialiased; letter-spacing: -0.011em;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(1100px 620px at 50% -12%, var(--wash), transparent 68%);
  }
  button, input { font-family: inherit; color: inherit; font-size: inherit; }
  button { cursor: pointer; background: none; border: none; padding: 0; }
  ::selection { background: var(--accent-bg); }

  .hero, .app { display: none; }
  body.home .hero { display: flex; }
  body.viewing .app { display: flex; }

  /* ───────── search (shared) ───────── */
  .search { position: relative; width: 100%; min-width: 0; }
  .search .ico { position: absolute; left: 16px; top: 15px; color: var(--ink-3); pointer-events: none; }
  .search input {
    width: 100%; min-width: 0; height: 50px; padding: 0 16px 0 46px; color: var(--ink);
    font-size: 17px; letter-spacing: -0.012em;
    background: var(--surface); border: 1px solid var(--hair); border-radius: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
    transition: border-color .16s, box-shadow .16s;
  }
  .search input::placeholder { color: var(--ink-3); }
  .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-bg); }
  .search .kbd {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font-size: 11.5px; color: var(--ink-3); border: 1px solid var(--hair);
    border-radius: 6px; padding: 2px 6px; pointer-events: none; letter-spacing: 0;
  }
  .search input:focus ~ .kbd, .search input:not(:placeholder-shown) ~ .kbd { opacity: 0; }

  .sugs {
    position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 40;
    margin: 0; padding: 6px; list-style: none; text-align: left;
    background: var(--surface); border: 1px solid var(--hair); border-radius: 14px;
    box-shadow: var(--pop); max-height: 320px; overflow: auto;
  }
  .sugs:not(.open) { display: none; }
  .sugs .lbl { padding: 7px 11px 5px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
               text-transform: uppercase; color: var(--ink-3); }
  .sugs li[data-sug] {
    padding: 9px 11px; border-radius: 9px; font-size: 15.5px; cursor: pointer;
    display: flex; align-items: center; gap: 9px;
  }
  .sugs li[data-sug] svg { color: var(--ink-3); flex: none; }
  .sugs li.sel { background: var(--surface-2); }

  /* ───────── home ───────── */
  .hero { min-height: 100svh; flex-direction: column; align-items: center; justify-content: center;
          text-align: center; padding: 40px 24px 5vh; }
  .mark { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600;
          color: var(--ink-2); letter-spacing: -0.01em; }
  .mark .g { color: var(--accent); font-size: 15px; }
  .display {
    margin: 26px 0 32px; font-family: var(--serif); font-weight: 600; font-size: clamp(30px, 5.2vw, 46px);
    line-height: 1.14; letter-spacing: -0.022em; max-width: 27ch; text-wrap: balance;
  }
  .display em { font-style: italic; color: var(--accent); }
  .hero .search { max-width: 460px; }
  .egs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 22px; }
  .pill {
    background: var(--surface); border: 1px solid var(--hair); border-radius: 999px;
    padding: 8px 15px; font-size: 14.5px; color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,.035); transition: border-color .15s, color .15s, transform .1s;
  }
  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .pill:active { transform: scale(.97); }
  .hero .foot { margin-top: 34px; display: flex; align-items: center; gap: 9px;
                font-size: 13.5px; color: var(--ink-3); }
  .hero .foot b { font-weight: 400; color: var(--ink-2); }

  /* ───────── viewing ───────── */
  .app { flex-direction: column; min-height: 100svh; }
  .bar {
    position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px;
    height: 60px; padding: 0 20px; background: var(--glass);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--hair);
  }
  .bar > .inner { display: flex; align-items: center; gap: 14px; width: 100%; max-width: 1040px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 15.5px; font-weight: 600;
           color: var(--ink); white-space: nowrap; letter-spacing: -0.02em; }
  .brand .g { color: var(--accent); font-size: 15px; }
  .brand:hover { opacity: .65; }
  .bar .mid { flex: 1; min-width: 0; display: flex; justify-content: center; }
  .bar .search { max-width: 400px; }
  .bar .search input { height: 38px; padding: 0 14px 0 39px; font-size: 15px; border-radius: 11px; }
  .bar .search .ico { left: 13px; top: 10px; }
  .bar .search .kbd { display: none; }
  .tools { display: flex; gap: 2px; }
  .tool { color: var(--ink-2); display: grid; place-items: center; width: 36px; height: 36px;
          border-radius: 9px; flex: none; transition: background .15s, color .15s; }
  .tool:hover { background: var(--surface-2); color: var(--ink); }
  .tool.on { color: var(--star); }
  .tool.act { background: var(--surface-2); color: var(--ink); }

  .page { flex: 1; width: 100%; max-width: 700px; margin: 0 auto; padding: clamp(18px, 6vh, 54px) 22px 90px; }

  .trail { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; font-size: 13px; }
  .trail:empty { display: none; }
  .trail .step { color: var(--ink-2); padding: 4px 9px; border-radius: 999px; background: var(--surface);
                 border: 1px solid var(--hair); }
  .trail .step:hover { color: var(--accent); border-color: var(--accent); }
  .trail .step.cur { color: var(--ink); font-weight: 600; }
  .trail .sep { color: var(--ink-3); }

  .entry {
    background: var(--surface); border: 1px solid var(--hair); border-radius: 22px;
    box-shadow: var(--shadow); padding: 34px 36px 30px;
    animation: rise .34s cubic-bezier(.22,.7,.3,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(9px); } }
  @media (prefers-reduced-motion: reduce) { .entry { animation: none; } }

  .head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .head h1 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 46px;
             letter-spacing: -0.022em; line-height: 1.08; word-break: break-word; }
  .phon { color: var(--ink-2); font-size: 15px; letter-spacing: 0; }
  .say { color: var(--accent); background: var(--accent-bg); display: grid; place-items: center;
         width: 36px; height: 36px; border-radius: 50%; margin-left: auto; flex: none; transition: transform .1s; }
  .say:hover { filter: brightness(.96); }
  .say:active { transform: scale(.88); }

  .pos { margin: 30px 0 10px; font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--ink-2); }
  .pos:first-of-type { margin-top: 26px; }
  ol { margin: 0; padding-left: 25px; font-family: var(--serif); }
  ol li { margin: 12px 0; font-size: 18.5px; line-height: 1.62; }
  ol li::marker { color: var(--ink-3); font-size: 14px; font-family: var(--ui); }
  .eg { color: var(--ink-2); font-style: italic; margin-top: 6px; }
  .eg::before { content: "\201C"; } .eg::after { content: "\201D"; }
  .sim { margin-top: 18px; font-family: var(--ui); font-size: 14.5px; color: var(--ink-2); }
  .sim .lbl { color: var(--ink-3); }

  .deeper { margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--hair); }
  .deeper .lbl { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
                 color: var(--ink-3); margin-bottom: 11px; }
  .deeper .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .src { margin-top: 18px; font-size: 12px; color: var(--ink-3); }

  .tip { margin: 18px auto 0; text-align: center; font-size: 13.5px; color: var(--ink-3); }
  .w { cursor: pointer; border-radius: 4px; transition: color .12s, background .12s; }
  .w:hover { color: var(--accent); background: var(--accent-bg); box-shadow: 0 0 0 2px var(--accent-bg); }

  .panel { background: var(--surface); border: 1px solid var(--hair); border-radius: 18px;
           box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 18px; }
  .panel:not(.open) { display: none; }
  .panel h2 { margin: 0 0 13px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em;
              text-transform: uppercase; color: var(--ink-3); }
  .panel .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .panel .none { color: var(--ink-3); font-size: 14.5px; }

  .msg { text-align: center; color: var(--ink-2); font-size: 16px; padding: 22px 0 6px; }
  .msg b { color: var(--ink); }
  .msg .did { margin-top: 14px; display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .msg .lead { font-size: 14px; color: var(--ink-3); }
  .spin { display: inline-block; width: 15px; height: 15px; border: 2px solid var(--hair);
          border-top-color: var(--accent); border-radius: 50%; animation: sp .7s linear infinite;
          vertical-align: -2px; margin-right: 8px; }
  @keyframes sp { to { transform: rotate(360deg); } }

  @media (max-width: 620px) {
    .bar { padding: 0 12px; }
    .bar > .inner { gap: 10px; }
    .bar .search input { font-size: 16px; }
    .brand span:last-child { display: none; }
    .page { padding: 16px 16px 70px; }
    .entry { padding: 26px 22px 24px; border-radius: 18px; }
    .head h1 { font-size: 36px; }
    ol li { font-size: 17.5px; }
    .mark { font-size: 34px; }
    .hero .sub { font-size: 17px; }
  }
</style>

<body class="home">

<section class="hero">
  <div class="mark"><span class="g">◎</span> Nested</div>
  <h1 class="display">Learn a language by diving through its <em>own</em> words.</h1>
  <div class="search">
    <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
    <input id="q" placeholder="Look up a word" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" />
    <span class="kbd">/</span>
    <ul class="sugs" id="s1"></ul>
  </div>
  <div class="egs" id="egs"></div>
  <p class="foot"><b>serendipity</b> › <b>chance</b> › <b>fortune</b> › keep going</p>
</section>

<div class="app">
  <header class="bar"><div class="inner">
    <button class="brand" onclick="reset()"><span class="g">◎</span> <span>Nested</span></button>
    <div class="mid">
      <div class="search">
        <span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
        <input id="q2" placeholder="Look up a word" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" />
        <ul class="sugs" id="s2"></ul>
      </div>
    </div>
    <div class="tools">
      <button class="tool" id="star" title="Save this word" onclick="toggleStar()">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.6l2.5 5.5 6 .6-4.5 4 1.3 5.9L12 16.5 6.7 19.6 8 13.7l-4.5-4 6-.6z"/></svg>
      </button>
      <button class="tool" id="lib" title="Saved words" onclick="togglePanel()">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v16l-6-4-6 4z"/></svg>
      </button>
    </div>
  </div></header>

  <div class="page">
    <div class="panel" id="panel"><h2>Saved words</h2><div class="chips" id="savedList"></div></div>
    <nav class="trail" id="trail"></nav>
    <main id="stage"></main>
  </div>
</div>

<script>
const API = "https://api.dictionaryapi.dev/api/v2/entries/en/";
const WIK = "https://en.wiktionary.org/api/rest_v1/page/definition/";
const SUG = "https://api.datamuse.com/sug?max=7&s=";
const SPELL = "https://api.datamuse.com/words?max=4&sp=";
const MAX_SAVED = 500, MAX_RECENT = 8;
const EXAMPLES = ["serendipity", "ephemeral", "resilience", "nuance"];
const STOP = new Set("the a an and or of to in on for with that which who whom whose is are was were be been being as by at from into it its this these those something someone anything not but if then than so such very more most other others any all each some can may often used using use having have has had do does done".split(" "));

const $ = s => document.querySelector(s);
const stage = $("#stage"), trailEl = $("#trail");
let trail = [], current = null;
const cache = new Map();

const store = {
  read(k){ try { return JSON.parse(localStorage[k] || "[]"); } catch { return []; } },
  get list(){ return this.read("nst"); },
  set list(v){ try { localStorage.nst = JSON.stringify(v.slice(0, MAX_SAVED)); } catch {} },
  has(w){ return this.list.includes(w); },
  toggle(w){ const l = this.list; this.list = l.includes(w) ? l.filter(x => x !== w) : [w, ...l]; },
  get recent(){ return this.read("nst_recent"); },
  push(w){ try { localStorage.nst_recent = JSON.stringify([w, ...this.recent.filter(x => x !== w)].slice(0, MAX_RECENT)); } catch {} },
};

/* ───────── search with live suggestions ───────── */
function wireSearch(input, list) {
  let sel = -1, items = [], timer = 0;

  const close = () => { list.classList.remove("open"); sel = -1; };
  const paint = (label, words) => {
    items = words;
    if (!words.length) return close();
    list.innerHTML = `<div class="lbl">${label}</div>` + words.map((w, i) =>
      `<li data-sug="${esc(w)}" data-i="${i}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>${w}</li>`).join("");
    list.classList.add("open");
    sel = -1;
  };
  const mark = () => list.querySelectorAll("li[data-sug]").forEach((el, i) => el.classList.toggle("sel", i === sel));

  const query = async () => {
    const v = input.value.trim();
    if (!v) return paint("Recent", store.recent);
    try {
      const r = await fetch(SUG + encodeURIComponent(v));
      const j = await r.json();
      if (input.value.trim() !== v) return;
      paint("Suggestions", j.map(x => x.word).filter(w => /^[A-Za-z][A-Za-z '-]*$/.test(w)).slice(0, 7));
    } catch { close(); }
  };

  input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(query, 130); });
  input.addEventListener("focus", () => { if (!input.value.trim()) paint("Recent", store.recent); else query(); });
  input.addEventListener("blur", () => setTimeout(close, 150));
  input.addEventListener("keydown", e => {
    const open = list.classList.contains("open");
    if (e.key === "ArrowDown" && open) { e.preventDefault(); sel = (sel + 1) % items.length; mark(); }
    else if (e.key === "ArrowUp" && open) { e.preventDefault(); sel = (sel - 1 + items.length) % items.length; mark(); }
    else if (e.key === "Escape") { close(); input.blur(); }
    else if (e.key === "Enter") {
      const v = (open && sel >= 0) ? items[sel] : input.value.trim();
      if (v) { close(); input.blur(); dig(v); }
    }
  });
  list.addEventListener("mousedown", e => {
    const li = e.target.closest("li[data-sug]");
    if (li) { e.preventDefault(); close(); input.blur(); dig(li.dataset.sug); }
  });
}
const q = $("#q"), q2 = $("#q2");
wireSearch(q, $("#s1"));
wireSearch(q2, $("#s2"));

document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if ((e.key === "k" && (e.metaKey || e.ctrlKey)) || (e.key === "/" && !typing)) {
    e.preventDefault();
    const el = document.body.classList.contains("home") ? q : q2;
    el.focus(); el.select();
  }
});

$("#egs").innerHTML = EXAMPLES.map(w => `<button class="pill" data-w="${w}">${w}</button>`).join("");
document.addEventListener("click", e => { const el = e.target.closest("[data-w]"); if (el) dig(el.dataset.w); });

/* ───────── navigation ───────── */
function reset() {
  trail = []; current = null; q.value = ""; q2.value = "";
  renderTrail(); stage.innerHTML = ""; $("#panel").classList.remove("open"); $("#lib").classList.remove("act");
  document.body.className = "home";
}

async function dig(word) {
  word = String(word).replace(/[^A-Za-z' -]/g, "").trim();
  if (!word) return;
  const i = trail.indexOf(word);
  trail = i >= 0 ? trail.slice(0, i + 1) : [...trail, word];
  q.value = word; q2.value = word;
  document.body.className = "viewing";
  $("#panel").classList.remove("open"); $("#lib").classList.remove("act");
  renderTrail();
  window.scrollTo({ top: 0, behavior: "instant" });
  await load(word);
}
function goTo(i) { trail = trail.slice(0, i + 1); renderTrail(); load(trail[i]); }

function renderTrail() {
  trailEl.innerHTML = "";
  if (trail.length < 2) return;
  trail.forEach((w, i) => {
    if (i) { const s = document.createElement("span"); s.className = "sep"; s.textContent = "›"; trailEl.appendChild(s); }
    const b = document.createElement("button");
    b.className = "step" + (i === trail.length - 1 ? " cur" : "");
    b.textContent = w; b.onclick = () => goTo(i);
    trailEl.appendChild(b);
  });
}

/* ───────── data ───────── */
async function load(word) {
  stage.innerHTML = `<div class="entry"><p class="msg"><span class="spin"></span>Looking up “${word}”…</p></div>`;
  try {
    let entry = cache.get(word);
    if (!entry) { entry = await fetchEntry(word); cache.set(word, entry); }
    current = { word, data: entry.data };
    store.push(word);
    render(word, entry.data, entry.source);
  } catch (err) {
    current = null; syncStar();
    if (err && err.net) {               // reached nobody — that is not the same as "no such word"
      stage.innerHTML = `<div class="entry"><p class="msg">Couldn’t reach the dictionary.<span class="did"><button class="pill" data-w="${esc(word)}">Try again</button></span></p></div>`;
      return;
    }
    stage.innerHTML = `<div class="entry"><p class="msg">No entry for “<b>${esc(word)}</b>”.<span class="did" id="did"></span></p></div>`;
    try {
      const j = await (await fetch(SPELL + encodeURIComponent(word))).json();
      const alts = j.map(x => x.word).filter(w => w.toLowerCase() !== word.toLowerCase()).slice(0, 4);
      const el = $("#did");
      if (alts.length && el) el.innerHTML = `<span class="lead">Did you mean</span>` + alts.map(w => `<button class="pill" data-w="${esc(w)}">${esc(w)}</button>`).join("");
    } catch {}
  }
}

async function fetchEntry(word) {
  const cands = [...new Set([word, word.toLowerCase(), cap(word)])];
  let net = false;                      // a source failed to answer at all (offline / rate limit)
  for (const c of cands) {
    try { const r = await fetch(API + encodeURIComponent(c)); if (r.ok) return { data: await r.json(), source: "dict" }; }
    catch { net = true; }               // never let one dead source skip the fallback below
  }
  for (const c of cands) {
    try {
      const w = await fetch(WIK + encodeURIComponent(c));
      if (!w.ok) continue;
      const data = parseWik(await w.json());
      if (data) return { data, source: "wik" };
    } catch { net = true; }
  }
  const err = new Error("not found"); err.net = net; throw err;
}
function cap(w) { return w ? w[0].toUpperCase() + w.slice(1) : w; }
function parseWik(j) {
  const en = (j.en || []).filter(b => (b.definitions || []).some(d => strip(d.definition).trim()));
  if (!en.length) return null;
  return [{ phonetics: [], phonetic: "", meanings: en.map(b => ({
    partOfSpeech: (b.partOfSpeech || "").toLowerCase(),
    definitions: b.definitions.map(d => ({
      definition: strip(d.definition),
      example: (d.examples && d.examples[0]) ? strip(d.examples[0]) : null,
    })).filter(d => d.definition.trim()),
    synonyms: [],
  })) }];
}
function strip(html) { const t = document.createElement("div"); t.innerHTML = html || ""; return (t.textContent || "").trim(); }

/* ───────── render ───────── */
function render(word, data, source) {
  const phon = (data[0].phonetics || []).map(p => p.text).find(Boolean) || data[0].phonetic || "";
  const audio = (data[0].phonetics || []).map(p => p.audio).find(Boolean) || "";
  const defs = [];

  let html = `<div class="entry"><div class="head">
    <h1>${esc(word)}</h1>
    ${phon ? `<span class="phon">${esc(phon)}</span>` : ""}
    <button class="say" title="Pronounce" onclick="speak('${esc(word)}','${audio}')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 8.5a5 5 0 010 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>`;

  data.forEach(entry => (entry.meanings || []).forEach(m => {
    html += `<div class="pos">${esc(m.partOfSpeech || "")}</div><ol>`;
    (m.definitions || []).slice(0, 5).forEach(d => {
      defs.push(d.definition);
      html += `<li>${clickable(d.definition)}`;
      if (d.example) html += `<div class="eg">${clickable(d.example)}</div>`;
      html += `</li>`;
    });
    html += `</ol>`;
    const syns = (m.synonyms || []).slice(0, 8);
    if (syns.length) html += `<div class="sim"><span class="lbl">Similar </span>${syns.map(s => `<span class="w" data-w="${esc(s)}">${esc(s)}</span>`).join(", ")}</div>`;
  }));

  const next = pickWords(defs, word);
  if (next.length) {
    html += `<div class="deeper"><div class="lbl">Dive deeper</div><div class="chips">${
      next.map(w => `<button class="pill" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div></div>`;
  }
  if (source === "wik") html += `<p class="src">via Wiktionary</p>`;
  html += `</div>`;
  if (trail.length < 2) html += `<p class="tip">Tap any word above to open its definition.</p>`;

  stage.innerHTML = html;
  syncStar();
}

function pickWords(defs, word) {
  const seen = new Set([word.toLowerCase()]), out = [];
  for (const d of defs) {
    for (const m of (d.match(/[A-Za-z][A-Za-z'-]{4,}/g) || [])) {
      const k = m.toLowerCase();
      if (STOP.has(k) || seen.has(k)) continue;
      seen.add(k); out.push(m);
      if (out.length === 5) return out;
    }
  }
  return out;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function clickable(t) { return esc(t).replace(/[A-Za-z][A-Za-z'-]*/g, m => `<span class="w" data-w="${m}">${m}</span>`); }

/* ───────── audio ───────── */
function speak(word, audio) {
  if (audio) new Audio(audio.startsWith("//") ? "https:" + audio : audio).play().catch(() => tts(word));
  else tts(word);
}
function tts(word) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(word);
  u.lang = "en-US"; u.rate = .95;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ───────── saved ───────── */
function toggleStar() { if (!current) return; store.toggle(current.word); syncStar(); }
function syncStar() {
  const btn = $("#star"), on = !!(current && store.has(current.word));
  btn.classList.toggle("on", on);
  btn.querySelector("path").setAttribute("fill", on ? "currentColor" : "none");
  btn.style.opacity = current ? 1 : .4;
  renderSaved();
}
function togglePanel() {
  const p = $("#panel"), open = p.classList.toggle("open");
  $("#lib").classList.toggle("act", open);
  renderSaved();
}
function renderSaved() {
  const l = store.list;
  $("#savedList").innerHTML = l.length
    ? l.map(w => `<button class="pill" data-w="${esc(w)}">${esc(w)}</button>`).join("")
    : `<span class="none">Star a word to keep it here.</span>`;
}

reset();
Object.assign(window, { dig, goTo, speak, toggleStar, togglePanel, reset });
</script>
